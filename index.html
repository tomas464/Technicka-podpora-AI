```html
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Support</title>
</head>

<body>

    <div class="container">

        <h1>Tech Support</h1>

        <!-- Formulář -->
        <div class="box">
            <h2>Kontaktujte podporu</h2>

            <form id="supportForm">

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="vas@email.cz"
                    required
                >

                <label for="question">Váš dotaz</label>
                <textarea
                    id="question"
                    placeholder="Popište svůj problém..."
                    required
                ></textarea>

                <button type="submit">
                    Odeslat dotaz
                </button>

            </form>
        </div>

        <!-- Odpověď podpory -->
        <div class="box">
            <h2>Odpověď podpory</h2>

            <div class="answer" id="answer">
                Odpověď podpory se zobrazí zde.
            </div>
        </div>

    </div>

</body>
</html>
```
